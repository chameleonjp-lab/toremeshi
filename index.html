<script>
(() => {
  'use strict';
  const dialog = document.getElementById('commonShareFallback');
  const field = document.getElementById('commonShareText');
  const status = document.getElementById('commonShareStatus');
  window.openGameShareX = (text) => {
    const body = String(text);
    const intent = new URL('https://x.com/intent/post');
    intent.searchParams.set('text', body);
    let popup;
    try {
      popup = window.open('', '_blank');
      if (popup) {
        popup.opener = null;
        popup.location.replace(intent.href);
        return;
      }
    } catch (_) {
      try { if (popup) popup.close(); } catch (_) {}
    }
    field.value = body;
    status.textContent = '';
    if (!dialog.open) dialog.showModal();
    field.focus();
    field.select();
  };
  document.getElementById('commonShareCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(field.value);
      status.textContent = window.gameT("ui_001");
    } catch (_) {
      field.focus();
      field.select();
      status.textContent = window.gameT("ui_002");
    }
  });
  document.getElementById('commonShareClose').addEventListener('click', () => dialog.close());
})();
</script>
