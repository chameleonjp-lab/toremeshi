name: Validate and publish Pages
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-pages.py
      - run: python scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages source and latest publication commit
        uses: actions/github-script@v7
        with:
          script: |
            const pages = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            if (pages.data.build_type !== 'workflow') throw new Error('Set Settings > Pages > Source to GitHub Actions before merging.');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== context.sha) throw new Error('A newer publication commit exists; this run must not deploy.');
      - name: Deploy the validated artifact from this run
        id: deployment
        uses: actions/deploy-pages@v4
